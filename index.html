<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    text-align: left;
  }

  h1, h2, h3 {
    text-align: left;
    margin-bottom: 6px;
  }

  .day-selector, #standalone-section {
    margin-bottom: 10px;
  }

  label {
    font-weight: bold;
    margin-right: 10px;
  }

  select {
    padding: 5px;
  }

  #generate-btn, #print-btn {
    padding: 8px 16px;
    font-size: 15px;
    cursor: pointer;
    margin: 10px 0;
    display: inline-block;
  }

  #output {
    margin-top: 30px;
  }

  .recipe {
    margin-bottom: 30px;
  }

  .print-page {
    page-break-before: always;
  }

  ul {
    list-style-type: disc;
    margin: 0;
    padding-left: 20px;
  }

/* ---------- SHOPPING LIST ---------- */
#shopping-page h2 {
  text-align: center;
  margin-bottom: 10px;
}

.shopping-columns {
  column-count: 2;
  column-gap: 40px;
  column-fill: auto;
}

.category-block {
  break-inside: avoid;
}

.shopping-columns h3 {
  margin: 8px 0 4px 0;
}

.shopping-columns ul {
  margin: 0 0 10px 0;
  padding-left: 20px;
}
  /* ---------- RECIPE SPACING ---------- */
  .recipe p {
    margin: 2px 0;
    line-height: 1.2;
  }

  /* ---------- PRINT RULES ---------- */
  @media print {
    body * {
      visibility: hidden;
    }

    #output, #output * {
      visibility: visible;
    }

    #output {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
    }

    #generate-btn, #print-btn {
      display: none;
    }
  }
</style>
</head>

// -----------------------------
// Unit conversion
// -----------------------------
const volumeToTsp = { tsp:1, tbsp:3, cup:48, pint:96, quart:192, gallon: 768 };
const weightToOz = { oz:1, lb:16 };

// -----------------------------
// Fraction helpers
// -----------------------------
function gcd(a,b){return b===0?a:gcd(b,a%b);}
function toMixedFraction(value){
  const whole=Math.floor(value),frac=value-whole;
  if(frac===0) return `${whole}`;
  const denominators=[2,3,4,6,8,12,16];
  let bestNumerator=1,bestDenominator=2,minError=Infinity;
  for(let d of denominators){
    let n=Math.round(frac*d),error=Math.abs(frac-n/d);
    if(error<minError && n>0){bestNumerator=n;bestDenominator=d;minError=error;}
  }
  const divisor=gcd(bestNumerator,bestDenominator);
  const numerator=bestNumerator/divisor;
  const denominator=bestDenominator/divisor;
  if(whole===0) return `${numerator}/${denominator}`;
  return `${whole} ${numerator}/${denominator}`;
}
// -----------------------------
// Shopping list builder
// -----------------------------
function generateShoppingColumns(allIngredients){
  const totals = {};

  allIngredients.forEach(ing => {
    let amount = ing.amount;
    let unit = ing.unit.toLowerCase();

    if (volumeToTsp[unit]) {
      amount *= volumeToTsp[unit];
      unit = "tsp";
    } else if (weightToOz[unit]) {
      amount *= weightToOz[unit];
      unit = "oz";
    }

    if (!totals[ing.name]) {
      totals[ing.name] = { amount: 0, unit, category: ing.category || "Other" };
    }
    totals[ing.name].amount += amount;
  });

  const categories = {};
  for (let name in totals) {
    const { amount, unit, category } = totals[name];
    if (!categories[category]) categories[category] = [];
    categories[category].push({ name, amount, unit });
  }

  const orderedCats = Object.keys(categories).sort();
  orderedCats.forEach(cat => {
    categories[cat].sort((a, b) => a.name.localeCompare(b.name));
  });

  const rows = [];
  orderedCats.forEach(cat => {
    rows.push({ type: "header", text: cat });
    categories[cat].forEach(item => {
      rows.push({ type: "item", item });
    });
  });

const midpoint = Math.ceil(rows.length / 2);
const col1 = [];
const col2 = [];

let i = 0;
while (i < rows.length) {
  // Try not to split right before a header
  if (i >= midpoint && rows[i].type === "header") break;
  col1.push(rows[i]);
  i++;
}

while (i < rows.length) {
  col2.push(rows[i]);
  i++;
}


  function renderColumn(col){
    let html = "";
    let open = false;

    col.forEach(row => {
      if (row.type === "header") {
        if (open) html += "</ul>";
        html += `<h3>${row.text}</h3><ul>`;
        open = true;
      } else {
        const i = row.item;

        // ----- VOLUME (tsp base → gal/qt/cup/tbsp/tsp) -----
        if (i.unit === "tsp") {
          let amt = i.amount;

          let gallons = Math.floor(amt / volumeToTsp.gallon);
          amt -= gallons * volumeToTsp.gallon;

          let quarts = Math.floor(amt / volumeToTsp.quart);
          amt -= quarts * volumeToTsp.quart;

          let cups = Math.floor(amt / volumeToTsp.cup);
          amt -= cups * volumeToTsp.cup;

          let tbsp = Math.floor(amt / volumeToTsp.tbsp);
          amt -= tbsp * volumeToTsp.tbsp;

          let tsp = amt;

          let parts = [];
          if (gallons) parts.push(`${gallons} gal`);
          if (quarts) parts.push(`${quarts} qt`);
          if (cups) parts.push(`${cups} cup`);
          if (tbsp) parts.push(`${tbsp} tbsp`);
          if (tsp) parts.push(`${toMixedFraction(tsp)} tsp`);

          html += `<li>${i.name}: ${parts.join(" + ")}</li>`;
        }

        // ----- WEIGHT (oz base → lb/oz) -----
        else if (i.unit === "oz") {
          let amt = i.amount;

          let lbs = Math.floor(amt / weightToOz.lb);
          amt -= lbs * weightToOz.lb;

          let oz = amt;

          let parts = [];
          if (lbs) parts.push(`${lbs} lb`);
          if (oz) parts.push(`${toMixedFraction(oz)} oz`);

          html += `<li>${i.name}: ${parts.join(" + ")}</li>`;
        }

        // ----- EVERYTHING ELSE -----
        else {
          html += `<li>${i.name}: ${toMixedFraction(i.amount)} ${i.unit}</li>`;
        }
      }
    });

    if (open) html += "</ul>";
    return html;
  }

  return `
    <div id="shopping-page" class="print-page">
      <h2>Shopping List</h2>
      <div class="shopping-grid">
        <div class="shopping-col">${renderColumn(col1)}</div>
        <div class="shopping-col">${renderColumn(col2)}</div>
      </div>
    </div>
  `;
}

// -----------------------------
// UI Setup
// -----------------------------
document.addEventListener("DOMContentLoaded",()=>{
  const days=["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];

  days.forEach(day=>{
    const select=document.getElementById(day);
    recipes.forEach(r=>{
      const option=document.createElement("option");
      option.value=r.name;
      option.textContent=r.name;
      select.appendChild(option);
    });
  });

  const boxContainer=document.getElementById("standalone-checkboxes");
  standaloneItems.forEach((item,i)=>{
    const label=document.createElement("label");
    label.style.display="block";
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.value=i;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(` ${item.name} (${item.unit})`));
    boxContainer.appendChild(label);
  });

  document.getElementById("generate-btn").addEventListener("click",()=>{
    const selectedRecipes=[];
    days.forEach(day=>{
      const recipe=recipes.find(r=>r.name===document.getElementById(day).value);
      if(recipe) selectedRecipes.push(recipe);
    });

    const checkedStandalone=Array.from(
      document.querySelectorAll("#standalone-checkboxes input:checked")
    ).map(cb=>standaloneItems[cb.value]);

    const allIngredients=[
      ...selectedRecipes.flatMap(r=>r.ingredients),
      ...checkedStandalone
    ];

    document.getElementById("shopping-list").innerHTML=
      generateShoppingColumns(allIngredients);

    const recipesDiv=document.getElementById("recipes");
    recipesDiv.innerHTML="";
    selectedRecipes.forEach(r=>{
      const div=document.createElement("div");
      div.className="recipe print-page";
      let html=`<h2>${r.name}</h2><h3>Ingredients</h3><ul>`;
      r.ingredients.forEach(ing=>{
        html+=`<li>${toMixedFraction(ing.amount)} ${ing.unit} ${ing.name}</li>`;
      });
      html+="</ul><h3>Instructions</h3>";
      r.instructions.split("\n").forEach(line=>{
        if(line.trim()==="") html+="<p>&nbsp;</p>";
        else html+=`<p>${line}</p>`;
      });
      div.innerHTML=html;
      recipesDiv.appendChild(div);
    });
  });
});
</script>
